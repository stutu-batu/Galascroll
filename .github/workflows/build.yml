name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  # Her sürümde SADECE bu satırı değiştir (örn. 0.3.1 -> 0.3.2). APK adı ve uygulama sürümü buradan gelir.
  APP_VERSION: "0.3.1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Kodu Kopyala
      uses: actions/checkout@v4

    - name: Node.js Kur
      uses: actions/setup-node@v4
      with:
        node-version: 20

    # Capacitor 7 Android derlemesi JDK 21 ister (17 ile "invalid source release: 21" hatası verir)
    - name: Java (JDK 21) Kur
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Web Klasörünü Hazırla
      run: |
        mkdir -p www
        cp index.html www/
        sed -i "s/__APP_VERSION__/$APP_VERSION/g" www/index.html
        grep -n "const APP_VERSION" www/index.html

    # CLI paketleri kurulmadan "npx cap" çalışmaz (npx yanlış bir "cap" paketi indirmeye çalışır).
    # Sürümler sabit: Capacitor 7 + filesystem 7 + media eklentisi v8.
    - name: Bağımlılıkları Kur
      run: |
        [ -f package.json ] || npm init -y
        npm install --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/filesystem@7 @capacitor-community/media@8

    # androidGalleryMode olmadan eklenti SADECE kendi albümlerini görür, tüm galeriyi görmez.
    - name: Capacitor Ayarını Yaz
      run: |
        cat > capacitor.config.json <<'JSON'
        {
          "appId": "com.ornek.galascrol",
          "appName": "Galascroll",
          "webDir": "www",
          "plugins": {
            "Media": {
              "androidGalleryMode": true
            }
          }
        }
        JSON
        cat capacitor.config.json

    - name: Android Platformunu Ekle ve Senkronize Et
      run: |
        npx cap add android
        npx cap sync android

    # Silme için küçük bir yerel eklenti (Media eklentisinde silme yok).
    - name: Silme Eklentisini Ekle (Java)
      run: |
        D=android/app/src/main/java/com/ornek/galascrol
        mkdir -p "$D"
        cat > "$D/GalleryToolsPlugin.java" <<'JAVA'
        package com.ornek.galascrol;

        import android.content.Intent;
        import android.media.MediaScannerConnection;
        import android.net.Uri;
        import android.os.Build;
        import android.os.Environment;
        import android.provider.Settings;
        import com.getcapacitor.JSObject;
        import com.getcapacitor.Plugin;
        import com.getcapacitor.PluginCall;
        import com.getcapacitor.PluginMethod;
        import com.getcapacitor.annotation.CapacitorPlugin;
        import java.io.File;

        @CapacitorPlugin(name = "GalleryTools")
        public class GalleryToolsPlugin extends Plugin {

            private boolean hasAccess() {
                if (Build.VERSION.SDK_INT >= 30) {
                    return Environment.isExternalStorageManager();
                }
                return true;
            }

            @PluginMethod
            public void hasAllFilesAccess(PluginCall call) {
                JSObject r = new JSObject();
                r.put("granted", hasAccess());
                call.resolve(r);
            }

            @PluginMethod
            public void requestAllFilesAccess(PluginCall call) {
                Intent i;
                try {
                    i = new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION,
                        Uri.parse("package:" + getContext().getPackageName()));
                    i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                    getContext().startActivity(i);
                } catch (Exception e) {
                    i = new Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION);
                    i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                    getContext().startActivity(i);
                }
                call.resolve();
            }

            @PluginMethod
            public void deleteFile(PluginCall call) {
                String path = call.getString("path");
                if (path == null) {
                    call.reject("path yok");
                    return;
                }
                if (path.startsWith("file://")) {
                    path = Uri.parse(path).getPath();
                }
                if (!hasAccess()) {
                    call.reject("Tüm dosyalara erişim izni gerekli", "NO_ACCESS");
                    return;
                }
                File f = new File(path);
                if (!f.exists()) {
                    call.reject("Dosya bulunamadı: " + path);
                    return;
                }
                if (!f.delete()) {
                    call.reject("Dosya silinemedi: " + path);
                    return;
                }
                MediaScannerConnection.scanFile(getContext(), new String[] { path }, null, null);
                call.resolve();
            }
        }
        JAVA
        cat > "$D/MainActivity.java" <<'JAVA'
        package com.ornek.galascrol;

        import android.os.Bundle;
        import com.getcapacitor.BridgeActivity;

        public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
                registerPlugin(GalleryToolsPlugin.class);
                super.onCreate(savedInstanceState);
            }
        }
        JAVA
        ls -la "$D"

    - name: Android İzinlerini Ekle
      run: |
        python3 - <<'PY'
        path = "android/app/src/main/AndroidManifest.xml"
        s = open(path, encoding="utf-8").read()
        perms = ["READ_EXTERNAL_STORAGE", "WRITE_EXTERNAL_STORAGE", "READ_MEDIA_IMAGES", "READ_MEDIA_VIDEO", "MANAGE_EXTERNAL_STORAGE"]
        add = "".join('    <uses-permission android:name="android.permission.%s" />\n' % p for p in perms if p not in s)
        s = s.replace("</manifest>", add + "</manifest>")
        open(path, "w", encoding="utf-8").write(s)
        print(s)
        PY

    - name: Sürüm Numarasını Ayarla
      run: |
        IFS=. read -r MA MI PA <<< "$APP_VERSION"
        CODE=$((MA * 10000 + MI * 100 + PA))
        sed -i -E "s/versionCode [0-9]+/versionCode $CODE/; s/versionName \"[^\"]*\"/versionName \"$APP_VERSION\"/" android/app/build.gradle
        grep -n "versionCode\|versionName" android/app/build.gradle

    - name: Gradle ile APK Derle (Debug)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: APK Dosyasını Adlandır
      run: cp android/app/build/outputs/apk/debug/app-debug.apk "Galascroll-v${APP_VERSION}.apk"

    - name: APK Dosyasını Kaydet
      uses: actions/upload-artifact@v4
      with:
        name: Galascroll-v${{ env.APP_VERSION }}
        path: Galascroll-v${{ env.APP_VERSION }}.apk
